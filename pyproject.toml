[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenariotopo"
version = "0.1.0"
description = "Scenario-driven endpoint and lane-topology optimization utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.23.5",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

